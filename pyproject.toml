[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krizky-map"
version = "0.1.0"
description = "Leaflet-based map plugin for krizky static site generator"
requires-python = ">=3.12"
dependencies = [
    "krizky>=0.2",
]

[project.entry-points."krizky"]
map = "krizky_map.plugin:plugin"

[tool.hatch.build.targets.wheel]
packages = ["krizky_map"]

[tool.uv.sources]
krizky = { git = "https://github.com/msgre/krizky.git" }

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "__pycache__", ".pytest_cache", "tests/fixtures", ".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins
    "C4",   # comprehensions
    "SIM",  # simplify
    "PT",   # pytest style
    "RUF",  # ruff-specific
    "FA",   # future-annotations
    "TID",  # tidy-imports (banned-api níže)
]
ignore = [
    "E501",  # line-too-long — řídí line-length
]
allowed-confusables = ["×"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Python 3.12+ ho nepotřebuje; viz docs/guidelines/python.md"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
